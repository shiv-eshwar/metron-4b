model: artifacts/base-mlx-4bit
data: artifacts/data
adapter_path: artifacts/adapters/pilot
train: true
fine_tune_type: lora
mask_prompt: true
seed: 42
optimizer: adamw
batch_size: 1
grad_accumulation_steps: 2
num_layers: 16
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 8
  scale: 16.0
  dropout: 0.0
learning_rate: 0.00004
iters: 64
max_seq_length: 1024
grad_checkpoint: true
steps_per_report: 8
steps_per_eval: 32
save_every: 32
val_batches: -1
