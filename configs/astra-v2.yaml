model: artifacts/base-mlx-4bit
data: runs/astra-v2/data
adapter_path: artifacts/adapters/astra-v2
train: true
fine_tune_type: lora
mask_prompt: true
seed: 621907
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
batch_size: 2
grad_accumulation_steps: 4
epochs: 1
num_layers: 16
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]
  rank: 16
  scale: 2.0
  dropout: 0.0
learning_rate: 0.000025
cosine_warmup_fraction: 0.04
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 32
val_batches: -1
