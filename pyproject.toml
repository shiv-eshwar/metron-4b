[project]
name = "modeldistl"
version = "0.1.0"
description = "Train and measure a portable Qwen3-4B student with verified Astra demonstrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=3.20,<4",
    "huggingface-hub>=1,<2",
    "openai>=2,<4",
    "pydantic-monty==1.6.0",
]

[project.optional-dependencies]
train = ["mlx-lm[train]==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
bench = ["pyarrow>=18,<27"]
export = ["torch==2.11.0", "sentencepiece>=0.2", "pyyaml>=6", "tqdm>=4", "xxhash>=3", "numpy>=1.26", "transformers>=5.7,<6"]

[tool.uv]
package = false
